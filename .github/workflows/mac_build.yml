name: Build macOS DMG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3'
        target: 'desktop'

    - name: Build Project
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release

    - name: Deploy Qt & Make DMG
      run: |
        cd build
        macdeployqt *.app -qmldir=../ -dmg

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QtMirrorApp-Mac-DMG
        path: build/*.dmg
