name: Build macOS DMG

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14 # Fast & Available Runner

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.2'
        target: 'desktop'
        arch: 'clang_64'

    - name: Build Project
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release

    - name: Deploy Qt & Make DMG
      run: |
        cd build
        APP_PATH=$(find . -name "*.app" -maxdepth 2)
        macdeployqt "$APP_PATH" -qmldir=../ -dmg

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QtMirrorApp-Mac-DMG
        path: build/*.dmg
